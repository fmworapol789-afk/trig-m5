<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>สื่อการเรียนรู้ พีทาโกรัส: สำรวจพื้นที่ & แบบทดสอบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f7fb;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --color-a: #3b82f6;
      --color-a-light: #dbeafe;
      --color-b: #f59e0b;
      --color-b-light: #fef3c7;
      --color-c: #ef4444;
      --color-c-light: #fee2e2;
      --success: #10b981;
      --success-light: #ecfdf5;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 16px;
    }

    /* แถบสลับแท็บด้านบน */
    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 10px 8px;
      border: none;
      border-radius: 10px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .tab-section {
      display: none;
    }

    .tab-section.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.22rem;
      margin: 0 0 4px 0;
      color: #0f172a;
    }

    .subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* ==================== สไตล์ส่วนที่ 1: สื่อต่อจิ๊กซอว์ ==================== */
    .preset-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .preset-btn {
      flex: 1 1 calc(33.333% - 6px);
      min-width: 92px;
      padding: 8px 6px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 12px;
      font-family: 'Prompt', sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .preset-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: #1d4ed8;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .hint-badge {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.82);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      text-align: center;
    }

    .stat-box {
      padding: 8px 4px;
      border-radius: 12px;
      border: 2px solid transparent;
    }

    .stat-box.a { background: var(--color-a-light); border-color: var(--color-a); }
    .stat-box.b { background: var(--color-b-light); border-color: var(--color-b); }
    .stat-box.c { background: var(--color-c-light); border-color: var(--color-c); }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      display: block;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .operator {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--success);
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-blue {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
    }

    .btn-reset {
      background: #e2e8f0;
      color: #334155;
    }

    .slider-container {
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: 12px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--success);
      height: 8px;
      cursor: pointer;
    }

    .success-banner {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: var(--success-light);
      border: 2px solid var(--success);
      border-radius: 12px;
      text-align: center;
      color: #065f46;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* ==================== สไตล์ส่วนที่ 2: แบบทดสอบ 10 ข้อ ==================== */
    .quiz-progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .quiz-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .question-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .question-card.correct-card {
      border-color: var(--success);
      background: #f0fdf4;
    }

    .question-card.wrong-card {
      border-color: var(--color-c);
      background: #fef2f2;
    }

    .q-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 10px 0;
      line-height: 1.5;
      color: #0f172a;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .option-item.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: #1e40af;
      font-weight: 600;
    }

      border-color: var(--success);
      background: #dcfce7;
      color:
